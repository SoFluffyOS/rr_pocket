name: rr_pocket
description: "Run a Flutter project on your Android phone with RR Pocket: the pocket command and the Lumide plugin."
version: 0.1.0
repository: https://github.com/simonpham/rr_pocket

topics:
  - flutter
  - lumide-frameworks
  - lumide-plugin

executables:
  pocket: pocket

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  lumide_api: 1.13.0
  multicast_dns: ^0.3.2+5
  path: 1.9.1
  qr: ^3.0.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  yaml: ^3.1.3
