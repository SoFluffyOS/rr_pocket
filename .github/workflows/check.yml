# Runs on every push to main and every pull request: tool/check.sh on
# Linux, and the desktop package's tests on Linux, macOS and Windows, since
# the `pocket` command must work on all three (RULES.md).
#
# Flutter is the latest stable, like the Play release
# (deploy_google_play.yml) and the repo's .fvmrc.

name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tool/check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # permission_handler_android 14 compiles against SDK 37.
      - name: Install Android SDK Platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null

      - name: Install dependencies
        run: |
          (cd app && flutter pub get)
          (cd probe && flutter pub get)

      - run: tool/check.sh

  desktop:
    name: desktop tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get
      - run: dart analyze
      - run: dart test
