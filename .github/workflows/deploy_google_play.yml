# ==============================================================================
# GitHub Actions Workflow: Deploy to Google Play
# ==============================================================================
#
# RR Pocket ships Flutter's DEBUG engine (that is what runs a project's
# kernel with hot reload), so it is built by tool/build_aab.sh, which turns
# off the debuggable flag Play rejects, not by `flutter build appbundle
# --release`.
#
# Google Play's API can't create an app: upload the very first bundle by hand
# in the Play Console (build it with this workflow, or tool/build_aab.sh, and
# take the artifact). Every release after that can come from here.
#
# REQUIRED GITHUB REPOSITORY SECRETS:
# Navigate to: Repository Settings -> Secrets and variables -> Actions
#
# 1. ANDROID_KEYSTORE_BASE64
#    - Base64-encoded string of your Android upload keystore (.jks / .keystore).
#    - Generate via terminal:
#      base64 -i path/to/upload-keystore.jks | tr -d '\n' | pbcopy (macOS)
#      base64 -w 0 path/to/upload-keystore.jks (Linux)
#
# 2. ANDROID_KEY_ALIAS
#    - Alias name of the signing key inside your keystore (e.g. "upload" or "key0").
#
# 3. ANDROID_KEY_PASSWORD
#    - Password for the key alias.
#
# 4. ANDROID_STORE_FILE_PASSWORD
#    - Password for the keystore file itself.
#
# 5. GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
#    - Full JSON key content of a Google Cloud Service Account with "Google Play Developer Publishing API" access.
#    - Steps to create:
#      1. Go to Google Cloud Console -> IAM & Admin -> Service Accounts.
#      2. Create a service account and generate a JSON key.
#      3. Go to Google Play Console -> Users & Permissions -> Invite new user.
#      4. Invite the service account email with "Releases" permission on this app.
#
# OPTIONAL GITHUB REPOSITORY SECRETS:
#
# 6. ANDROID_APP_PACKAGE_NAME
#    - Application ID (defaults to "io.sofluffy.raccoon.runtime.pocket" if not provided).
#
# ==============================================================================

name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        type: choice
        default: 'internal'
        options:
          - production
          - beta
          - alpha
          - internal
      status:
        description: 'Release Status'
        required: true
        type: choice
        default: 'completed'
        options:
          - completed
          - draft
          - inProgress
          - halted
      user_fraction:
        description: 'Rollout fraction (0.0 to 1.0, e.g. 0.1 for 10% rollout; used when status is inProgress)'
        required: false
        type: string
        default: '1.0'
      build_name:
        description: 'Custom build version/name override (optional, e.g. 0.1.0)'
        required: false
        type: string
      build_number:
        description: 'Custom build number override (optional, e.g. 2)'
        required: false
        type: string

env:
  # RR Pocket runs a project's kernel only when the project's SDK has the same
  # engine. A release carries the latest stable Flutter at the time it is
  # built (the home screen and `pocket doctor` show which), so users on
  # stable match: update distribution/whatsnew when that version changes.
  PACKAGE_NAME: ${{ secrets.ANDROID_APP_PACKAGE_NAME || 'io.sofluffy.raccoon.runtime.pocket' }}

jobs:
  build-and-release:
    name: Build & Upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      # permission_handler_android 14 compiles against SDK 37.
      - name: Install Android SDK Platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null
          ls "$ANDROID_HOME/platforms"

      - name: Make scripts executable
        run: chmod +x tool/*.sh

      - name: Install dependencies
        run: |
          (cd app && flutter pub get)
          (cd probe && flutter pub get)

      - name: Run validation and test suites
        run: tool/check.sh

      - name: Configure Android Signing Credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_FILE_PASSWORD: ${{ secrets.ANDROID_STORE_FILE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty or not configured."
            exit 1
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_FILE_PASSWORD" ]; then
            echo "::error::One or more Android keystore secrets (ALIAS, KEY_PASSWORD, STORE_FILE_PASSWORD) are missing."
            exit 1
          fi

          mkdir -p .assets
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .assets/upload-keystore.jks

      - name: Build Android App Bundle (AAB)
        env:
          RR_KEYSTORE: ${{ github.workspace }}/.assets/upload-keystore.jks
          RR_KEYSTORE_PASS: ${{ secrets.ANDROID_STORE_FILE_PASSWORD }}
          RR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RR_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_ARGS=()
          if [ -n "${{ inputs.build_name }}" ]; then
            BUILD_ARGS+=("--build-name=${{ inputs.build_name }}")
          fi
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_ARGS+=("--build-number=${{ inputs.build_number }}")
          fi

          tool/build_aab.sh "${BUILD_ARGS[@]}"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rr-pocket-aab
          path: build/rr_pocket.aab
          retention-days: 14

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/rr_pocket.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          userFraction: ${{ inputs.status == 'inProgress' && inputs.user_fraction || '' }}
          whatsNewDirectory: distribution/whatsnew
