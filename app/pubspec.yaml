name: rr_pocket
description: "RR Pocket: run a Flutter project on this phone, no Android build."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.5

# Every Flutter plugin here is one a project can use on RR Pocket; the home
# screen lists them (lib/src/build_info.dart, kept in step by a test).
dependencies:
  audio_session: ^0.2.4
  battery_plus: ^7.1.2
  camera: ^0.12.1
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.3.0
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  gms_check: ^1.1.0
  image_picker: ^1.2.4
  in_app_review: ^2.0.12
  isar_community_flutter_libs: ^3.4.1
  just_audio: ^0.10.6
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  qr_code_scanner_plus: ^2.3.2
  record: ^7.1.2
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sofluffy_ui:
    git:
      url: https://github.com/SoFluffyOS/sofluffy_ui.git
      ref: f28e912f
  sqflite: ^2.4.5
  url_launcher: ^6.3.3
  vibration: ^3.2.1
  video_player: ^2.14.1
  wakelock_plus: ^1.8.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
        - asset: fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: fonts/Nunito-Black.ttf
          weight: 900
