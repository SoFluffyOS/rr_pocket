name: rr_pocket
description: "RR Pocket: run a Flutter project on this phone, no Android build."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

# Every plugin here is one a project can use on RR Pocket; the home screen
# lists them (lib/src/build_info.dart, kept in step by a test).
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
        - asset: fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: fonts/Nunito-Black.ttf
          weight: 900
