<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RR Pocket docs</title>
    <meta name="description" content="Install, pair and run your Flutter project on your phone with RR Pocket, and what to do when something doesn't run." />
    <meta property="og:title" content="RR Pocket docs" />
    <meta property="og:description" content="Install, pair and run your Flutter project on your phone with RR Pocket, and what to do when something doesn't run." />
    <meta name="theme-color" content="#1C1F23" />
    <link rel="canonical" href="https://rr.sofluffy.io/docs.html" />
    <meta property="og:url" content="https://rr.sofluffy.io/docs.html" />
    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <script>
      // Before the first paint, so a dark page never flashes light.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('rr-theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root" data-page="docs"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
