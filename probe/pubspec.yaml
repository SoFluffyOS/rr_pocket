name: probe
description: "Calls every plugin RR Pocket carries; run it to check a build."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.5

# The same plugins as ../app; tool/pin_plugins.py pins their versions.
dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^7.1.2
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.3.0
  file_picker: ^13.2.0
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  url_launcher: ^6.3.3
  vibration: ^3.2.1
  video_player: ^2.14.1
  wakelock_plus: ^1.8.0
  webview_flutter: ^4.14.1
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.3.2
  geolocator: ^14.1.2
  local_auth: ^3.0.2
  camera: ^0.12.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  record: ^7.1.2
  qr_code_scanner_plus: ^2.3.2
  gms_check: ^1.1.0
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  # Pure Dart on path_provider: checked, not bundled.
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
